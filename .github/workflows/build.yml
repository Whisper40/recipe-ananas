name: Build and Release APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable
          cache: true

      - name: Reset workspace and remove stale generated Android files
        shell: bash
        run: |
          git reset --hard HEAD
          git clean -ffdx
          rm -rf .dart_tool .flutter-plugins .flutter-plugins-dependencies build
          rm -rf android/app/src/main/java/io/flutter/plugins
          find android -path '*/GeneratedPluginRegistrant.java' -delete
          flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Run analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Read app version
        id: version
        run: echo "value=$(grep '^version:' pubspec.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          tag_name: v${{ steps.version.outputs.value }}
          name: Release ${{ steps.version.outputs.value }}
          body: |
            ## Nouvelle version disponible

            - Version: ${{ steps.version.outputs.value }}
            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref_name }}

            Téléchargez l'APK ci-dessous pour installer la mise à jour.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}