name: Build and Release APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable
          cache: true

      - name: Reset workspace and remove stale generated Android files
        shell: bash
        run: |
          git reset --hard HEAD
          git clean -ffdx
          rm -rf .dart_tool .flutter-plugins .flutter-plugins-dependencies build
          rm -rf android/app/src/main/java/io/flutter/plugins
          find android -path '*/GeneratedPluginRegistrant.java' -delete
          flutter clean

      - name: Restore keystore from secrets
        shell: bash
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/upload_keystore.jks
          chmod 600 android/upload_keystore.jks

      - name: Create key.properties
        shell: bash
        run: |
          echo "storeFile=upload_keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

      - name: Validate release signing key
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -s android/upload_keystore.jks
          test -s android/key.properties
          keytool -list -keystore android/upload_keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Get dependencies
        run: flutter pub get

      - name: Run analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Read app version
        id: version
        run: echo "value=$(grep '^version:' pubspec.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify release APK
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          tag_name: v${{ steps.version.outputs.value }}
          name: Release ${{ steps.version.outputs.value }}
          body: |
            ## Nouvelle version disponible

            - Version: ${{ steps.version.outputs.value }}
            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref_name }}

            Téléchargez l'APK ci-dessous pour installer la mise à jour.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}